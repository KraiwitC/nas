services:
    jellyfin:
        image: lscr.io/linuxserver/jellyfin:latest
        container_name: jellyfin
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=Asia/Bangkok
        volumes:
            - ~/nas-data/jellyfin/config:/config
            - ~/nas-data/jellyfin/cache:/cache
            - /mnt/HDD2TB:/data/media
        ports:
            - 8096:8096
        restart: unless-stopped

    qbittorrent:
        image: lscr.io/linuxserver/qbittorrent:latest
        container_name: qbittorrent
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=Asia/Bangkok
            - WEBUI_PORT=8080
            - TORRENTING_PORT=6881
        volumes:
            - ~/nas-data/qbittorrent/config:/config
            - /mnt/HDD2TB/Movies:/data/downloads
        ports:
            - 8080:8080
            - 6881:6881
            - 6881:6881/udp
        restart: unless-stopped

    homarr:
        image: ghcr.io/ajnart/homarr:latest
        container_name: homarr
        environment:
            - TZ=Asia/Bangkok
        volumes:
            - ~/nas-data/homarr/configs:/app/data/configs
            - ~/nas-data/homarr/icons:/app/public/icons
        ports:
            - 7575:7575
        restart: unless-stopped
