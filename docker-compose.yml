services:
    jellyfin:
        image: lscr.io/linuxserver/jellyfin:latest
        container_name: jellyfin
        network_mode: host
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=Asia/Bangkok
        volumes:
            - ~/nas-data/jellyfin/config:/config
            - ~/nas-data/jellyfin/cache:/cache
            - /mnt/HDD2TB:/data/media
        restart: unless-stopped

    qbittorrent:
        image: lscr.io/linuxserver/qbittorrent:latest
        container_name: qbittorrent
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=Asia/Bangkok
            - WEBUI_PORT=8080
            - TORRENTING_PORT=6881
        volumes:
            - ~/nas-data/qbittorrent/config:/config
            - /mnt/HDD2TB/Movies:/data/downloads-movie
        ports:
            - 8080:8080
            - 6881:6881
            - 6881:6881/udp
        restart: unless-stopped

    homer:
        image: b4bz/homer:latest
        container_name: homer
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=Asia/Bangkok
        volumes:
            - ~/nas-data/homer:/www/assets
        ports:
            - 80:8080
        restart: unless-stopped

    openspeedtest:
        image: openspeedtest/latest:latest
        container_name: openspeedtest
        ports:
            - 3000:3000
        restart: unless-stopped
